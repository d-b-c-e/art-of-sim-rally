name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline source and installer policy
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-10-01
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6, resolved 2026-10-01
        id: dotnet
        with:
          dotnet-version: '8.0.x'
          check-latest: false
      - name: Run committed-source checks
        working-directory: tools/ci
        run: |
          @{sdk = @{version = '${{ steps.dotnet.outputs.dotnet-version }}'; rollForward = 'disable'}} |
            ConvertTo-Json | Set-Content -LiteralPath global.json -Encoding utf8
          ./Test-Source.ps1
